name: Calendar maintenance

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Run calendar recovery and retries
        env:
          CLINICAL_PORTAL_URL: ${{ secrets.CLINICAL_PORTAL_URL }}
          CALENDAR_SYNC_SECRET: ${{ secrets.CALENDAR_SYNC_SECRET }}
        run: |
          if [ -z "$CLINICAL_PORTAL_URL" ] || [ -z "$CALENDAR_SYNC_SECRET" ]; then
            echo "Calendar maintenance secrets are not configured; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error             -X POST "$CLINICAL_PORTAL_URL/api/calendar/maintenance"             -H "Authorization: Bearer $CALENDAR_SYNC_SECRET"
