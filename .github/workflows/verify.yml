name: Verify

on:
  pull_request:
  push:
    branches:
      - delivery/calendar-discovery-governance

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinical_portal
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      CALENDAR_SYNC_SECRET: ci-calendar-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
