name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinic_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clinic_qa
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret
      NEXT_PUBLIC_SITE_URL: https://inmunoclinic.com
      CALENDAR_SYNC_SECRET: ci-calendar-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm run prisma:migrate:deploy
      - run: node --import tsx scripts/verify-calendar-runtime.ts
      - name: Verify public routes, authentication, private access and persisted operations
        run: |
          npm run start > /tmp/clinic-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/login > /dev/null; then break; fi
            sleep 1
          done
          node scripts/verify-http.mjs
          node scripts/verify-storage.mjs

  consolidate-integrated-branches:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove only the two verified and fully integrated branch references
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const main = await github.rest.git.getRef({...repo, ref: 'heads/main'});
            if (main.data.object.sha !== context.sha) {
              core.notice('Main moved; this run will not remove any branch.');
              return;
            }
            const integrated = [
              ['feat/inmunoclinic-four-public-pages', 'fd095e6b3a72658ce0b4477a45b8b827299a0754'],
              ['delivery/calendar-discovery-governance', '77e59a92f5fba241aee39f87de5c6e36a22e28c6']
            ];
            for (const [branch, expected] of integrated) {
              let ref;
              try { ref = await github.rest.git.getRef({...repo, ref: 'heads/' + branch}); }
              catch (error) { if (error.status === 404) continue; throw error; }
              if (ref.data.object.sha !== expected) throw new Error('Branch changed; preserving ' + branch);
              const comparison = await github.rest.repos.compareCommits({...repo, base: context.sha, head: expected});
              if (comparison.data.ahead_by !== 0 || !['behind','identical'].includes(comparison.data.status)) {
                throw new Error('Unintegrated history; preserving ' + branch);
              }
              const current = await github.rest.git.getRef({...repo, ref: 'heads/' + branch});
              if (current.data.object.sha !== expected) throw new Error('Branch moved; preserving ' + branch);
              await github.rest.git.deleteRef({...repo, ref: 'heads/' + branch});
              core.notice('Removed integrated branch reference: ' + branch);
            }
